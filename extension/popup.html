<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeRevise</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-main">Code</span><span class="logo-accent">Revise</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span class="status-text">Extension Active</span>
      </div>
    </header>

    <!-- Content Card -->
    <main class="main-content">
      <div id="problem-card" class="problem-card hidden">
        <h2 class="card-label">Current Problem</h2>
        <div class="problem-meta">
          <span id="problem-id" class="problem-id"></span>
          <span id="problem-difficulty" class="difficulty-badge"></span>
        </div>
        <h1 id="problem-title" class="problem-title"></h1>
        
        <!-- Topics Container -->
        <div id="topics-container" class="topics-container">
          <!-- chips will be added dynamically -->
        </div>

        <div class="divider"></div>
        <p id="problem-url" class="problem-url"></p>
      </div>

      <!-- Loading / Empty State Message Container -->
      <div id="state-card" class="state-card">
        <p id="state-text" class="state-text">Open a LeetCode problem to get started.</p>
      </div>

      <!-- Latest Submission Section -->
      <div id="submission-card" class="submission-card hidden">
        <h2 class="card-label">Latest Submission</h2>
        <div class="submission-status">
          <span class="status-check">✅</span>
          <span class="status-text">Accepted</span>
        </div>
        <p id="submission-meta" class="submission-meta"></p>
        <p id="submission-time" class="submission-time"></p>
      </div>

      <div id="no-submission-card" class="submission-card">
        <h2 class="card-label">Latest Submission</h2>
        <p class="no-submission-text">No Accepted submission yet.</p>
      </div>

      <!-- Action Button -->
      <button id="open-btn" class="action-btn">
        Open CodeRevise
      </button>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
